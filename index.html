<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldHEN Payload Injector</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 40px;
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #2a2a2a;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin: 20px 0;
            border: 1px solid #444;
            border-radius: 4px;
            background: #333;
            color: #fff;
            font-size: 16px;
            text-align: center;
        }
        button {
            background-color: #0070cc;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0059a3;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #aaa;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>GoldHEN Payload Injector</h2>
    <p>Ensure GoldHEN BinLoader is active on your PS4 (Port 9090).</p>
    
    <label for="ip">PS4 IP Address:</label><br>
    <input type="text" id="ip" placeholder="e.g. 192.168.1.50">
    
    <br>
    <button onclick="injectPayload()">Inject h.bin</button>
    
    <div id="status">Status: Ready</div>
</div>

<script>
// Automatically load the saved IP address when the page opens
window.onload = function() {
    const savedIp = localStorage.getItem('ps4_ip');
    if (savedIp) {
        document.getElementById('ip').value = savedIp;
        document.getElementById('status').innerText = "Status: IP loaded from memory.";
    }
};

async function injectPayload() {
    const ipInput = document.getElementById('ip');
    const ip = ipInput.value.trim();
    const statusDiv = document.getElementById('status');
    const payloadUrl = 'h.bin'; 
    const port = 9090;

    if (!ip) {
        statusDiv.innerText = "Status: Please enter your PS4's local IP address.";
        statusDiv.style.color = "#ff4d4d";
        return;
    }

    // Save the IP address so you don't have to type it next time
    localStorage.setItem('ps4_ip', ip);

    statusDiv.innerText = "Status: Fetching h.bin...";
    statusDiv.style.color = "#ffa500";

    try {
        const response = await fetch(payloadUrl);
        if (!response.ok) {
            throw new Error(`Failed to load ${payloadUrl} from GitHub.`);
        }
        
        const buffer = await response.arrayBuffer();
        statusDiv.innerText = `Status: Sending payload to ${ip}:${port}...`;

        const targetUrl = `http://${ip}:${port}/`;
        
        await fetch(targetUrl, {
            method: 'POST',
            mode: 'no-cors', 
            body: buffer
        });

        statusDiv.innerText = "Status: Payload sent successfully!";
        statusDiv.style.color = "#4dff4d";

    } catch (error) {
        statusDiv.innerText = `Status: Error - ${error.message}`;
        statusDiv.style.color = "#ff4d4d";
        console.error(error);
    }
}
</script>

</body>
</html>
